pose_lock_localizer:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    odom_frame: odom
    base_frame: base_link
    broadcast_hz: 30.0
    auto_initial_pose: true
    initial_x: -45.0467
    initial_y: 31.8558
    initial_yaw: -1.566514

centerline_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    base_frame: base_link
    goal_topic: /center_goal
    path_topic: /centerline_path
    cmd_vel_topic: /cmd_vel
    follow_path_action: /follow_path
    downsample_factor: 2
    robot_safe_radius_m: 0.52
    goal_snap_radius_m: 2.0
    center_weight: 0.55
    turn_penalty: 2.5
    path_point_spacing_m: 0.10
    corner_stop_sec: 0.15
    final_stop_sec: 0.25
    rotate_before_segment: true
    rotate_max_speed_rad_s: 1.80
    rotate_min_speed_rad_s: 0.35
    rotate_kp: 2.00
    rotate_tolerance_rad: 0.035
    rotate_stable_cycles: 2
    retry_delay_sec: 0.3
    max_follow_path_retries: 0

bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: true

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 15.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]
    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.15
      movement_time_allowance: 5.0
    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.12
      yaw_goal_tolerance: 3.14
    FollowPath:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 1.80
      max_vel_y: 0.0
      max_vel_theta: 1.10
      min_speed_xy: 0.0
      max_speed_xy: 1.80
      min_speed_theta: 0.0
      acc_lim_x: 1.8
      acc_lim_y: 0.0
      acc_lim_theta: 4.4
      decel_lim_x: -2.2
      decel_lim_y: 0.0
      decel_lim_theta: -5.6
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 30
      sim_time: 1.4
      linear_granularity: 0.04
      angular_granularity: 0.02
      transform_tolerance: 0.4
      xy_goal_tolerance: 0.12
      trans_stopped_velocity: 0.03
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: [RotateToGoal, Oscillation, BaseObstacle, GoalAlign, PathAlign, PathDist, GoalDist]
      BaseObstacle.scale: 0.10
      PathAlign.scale: 42.0
      PathAlign.forward_point_distance: 0.18
      GoalAlign.scale: 28.0
      GoalAlign.forward_point_distance: 0.18
      PathDist.scale: 44.0
      GoalDist.scale: 20.0
      RotateToGoal.scale: 36.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 8.0
      publish_frequency: 4.0
      global_frame: odom
      robot_base_frame: base_link
      use_sim_time: true
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      footprint: "[[-0.37, -0.37], [-0.37, 0.37], [0.37, 0.37], [0.37, -0.37]]"
      footprint_padding: 0.0
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: false
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 1.5
        mark_threshold: 0
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.2
        inflation_radius: 0.30
      always_send_full_costmap: true
  local_costmap_client:
    ros__parameters:
      use_sim_time: true
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

planner_server:
  ros__parameters:
    expected_planner_frequency: 5.0
    use_sim_time: true
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.25
      use_astar: true
      allow_unknown: false

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: true

global_costmap:
  global_costmap:
    ros__parameters:
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      use_sim_time: true
      footprint: "[[-0.37, -0.37], [-0.37, 0.37], [0.37, 0.37], [0.37, -0.37]]"
      footprint_padding: 0.0
      resolution: 0.05
      track_unknown_space: true
      plugins: [static_layer, obstacle_layer, inflation_layer]
      static_layer:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: nav2_costmap_2d::ObstacleLayer
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          max_obstacle_height: 1.5
          clearing: true
          marking: true
          data_type: LaserScan
          raytrace_max_range: 11.5
          raytrace_min_range: 0.15
          obstacle_max_range: 10.0
          obstacle_min_range: 0.15
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.2
        inflation_radius: 0.90
      always_send_full_costmap: true
  global_costmap_client:
    ros__parameters:
      use_sim_time: true
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: true

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.4
    use_sim_time: true
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.10
    min_rotational_vel: 0.30
    rotational_acc_lim: 4.4

robot_state_publisher:
  ros__parameters:
    use_sim_time: true

waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 20
    stop_on_failure: true
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: true
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [1.80, 0.0, 1.10]
    min_velocity: [0.0, 0.0, -1.10]
    max_accel: [1.8, 0.0, 4.4]
    max_decel: [-2.2, 0.0, -5.6]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.01, 0.0, 0.01]
    velocity_timeout: 0.35
